  <body>
    <div id="header-placeholder"></div>
    <h1>How to Use</h1>
    <a>To use the evolver, input a Latin word (in orthography, using macrons to represent length, j/i/u/v does not matter.)</a>
    <h1>Latin -> Romance Evolver</h1>
    <label for="latin">Latin:</label><input type="text" id="latin" name="latin"><input type="button" id="submit" value="Submit">[<output name="latinphon"></output>]<br><br>
    <label for="pr prphon">Proto-Romance: *</label><output name="pr"></output>&emsp;*[<output name="prphon"></output>]
  </body>
